name: Job Alert

on:
  schedule:
    # Every hour at :17 (UTC). Minute 17 avoids the busy top of the hour; GitHub may
    # still start runs several minutes late. In IST this is hh:47 every hour.
    # Rate-limited sources only fetch every few hours (see min_interval_hours in config/sources.json).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fetch and score, but send no alerts and call no AI)"
        type: boolean
        default: false

# Never run two jobs at once: they would race on the database and could send duplicate alerts.
concurrency:
  group: job-alert
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      # The SQLite database is kept in the Actions cache between runs.
      # Each run saves a new cache entry; restore picks the most recent one.
      - name: Restore job database
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - name: Discover jobs
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          CANDIDATE_PROFILE_JSON: ${{ secrets.CANDIDATE_PROFILE_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CHANNEL_FOOTER: ${{ vars.CHANNEL_FOOTER }}
          CHANNEL_MAX_POSTS: ${{ vars.CHANNEL_MAX_POSTS || '5' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MAX_NOTIFICATIONS: ${{ vars.MAX_NOTIFICATIONS || '10' }}
          AI_MAX_JOBS_PER_RUN: ${{ vars.AI_MAX_JOBS_PER_RUN || '5' }}
        run: python jobs.py run

      - name: Save job database
        if: always() && hashFiles('data/jobs.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
